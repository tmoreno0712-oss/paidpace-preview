te\"\u003eNo credit card to try the invoice dashboard · Sending requires an active plan\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"hero-visual\"\u003e\u003cdiv class=\"floating-badge\"\u003e\u003cspan class=\"badge-icon\"\u003e↗\u003c/span\u003e\u003cspan\u003e\u003cstrong\u003eA little nudge.\u003c/strong\u003e\u003csmall\u003eA lot less chasing.\u003c/small\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"app-preview\"\u003e\u003cdiv class=\"preview-head\"\u003e\u003cspan class=\"preview-symbol\"\u003ep·\u003c/span\u003e\u003cdiv class=\"fake-lines\"\u003e\u003cb\u003eGood morning, Sam \u003cspan\u003e✳\u003c/span\u003e\u003c/b\u003e\u003csmall\u003eHere's how your invoices are doing.\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"preview-label\"\u003eTOTAL OUTSTANDING\u003c/div\u003e\u003cdiv class=\"preview-number\"\u003e$12,840\u003cspan\u003e.00\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"preview-pills\"\u003e\u003cspan\u003e↗ 8 invoices active\u003c/span\u003e\u003cspan\u003e● 3 need a nudge\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"preview-list\"\u003e\u003cdiv\u003e\u003cspan class=\"preview-av lavender\"\u003eAC\u003c/span\u003e\u003cspan\u003eAcme Studio\u003csmall\u003eInvoice #1042 · 5 days overdue\u003c/small\u003e\u003c/span\u003e\u003cstrong\u003e$2,450\u003c/strong\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"preview-av mint\"\u003eNF\u003c/span\u003e\u003cspan\u003eNorthfield Co.\u003csmall\u003eInvoice #1041 · Due tomorrow\u003c/small\u003e\u003c/span\u003e\u003cstrong\u003e$1,200\u003c/strong\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"preview-av peach\"\u003eWS\u003c/span\u003e\u003cspan\u003eWestside Market\u003csmall\u003eInvoice #1040 · Paid\u003c/small\u003e\u003c/span\u003e\u003cstrong class=\"paid-text\"\u003e$4,500 ✓\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini-notice\"\u003e\u003cspan\u003e✉\u003c/span\u003e Your reminder dra const paths={'/':'home','/dashboard':'dashboard','/login':'login','/signup':'signup','/invoices/new':'invoice','/billing':'billing','/import':'import','/settings':'settings'};
function show(name){if(!pages[name]){flash('This preview screen is not included.');return};document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));frame.srcdoc=pages[name];}
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;if(!doc)return;

 doc.addEventListener('submit',ev=>{ev.preventDefault();flash('This is a visual demo. No information is saved or sent.');});
});
